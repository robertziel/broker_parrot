<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-labelledby="life-title"><style>
svg{--bg:#f6f4f3;--ink:#191416;--soft:#453e40;--faint:#6d6567;--accent:#7a2733;--tint:rgba(122,39,51,.1);--warn:#a06c14;--rule:#ded7d6;font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){svg{--bg:#161b22;--ink:#e6edf3;--soft:#b6bfc9;--faint:#8b949e;--accent:#ff8a8a;--tint:rgba(255,138,138,.12);--warn:#e3b341;--rule:#3d444d}}
.backdrop{fill:var(--bg)}.fill-strong{fill:var(--ink)}.fill-muted{fill:var(--soft)}.fill-dim{fill:var(--faint)}
.fill-accent{fill:var(--accent)}.fill-amber{fill:var(--warn)}.fill-bg{fill:var(--bg)}.fill-accent-tint{fill:var(--tint)}
.stroke-accent{stroke:var(--accent)}.stroke-amber{stroke:var(--warn)}.stroke-rule{stroke:var(--faint)}
</style><rect class="backdrop" width="760" height="340" rx="8"/>
  <title id="life-title">A job's lifecycle: queued to running to a terminal state, with lease-lapse reclaim looping back to queued</title>
  <defs>
    <marker id="l-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b2f23"/></marker>
    <marker id="l-amb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5871e"/></marker>
    <marker id="l-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b6539"/></marker>
    <marker id="l-mut" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7e7060"/></marker>
  </defs>
  <rect class="fill-bg stroke-rule" x="40" y="128" width="150" height="64" rx="6"/>
  <text class="fill-strong" x="115" y="156" text-anchor="middle" font-size="13" font-weight="600">queued</text>
  <text class="fill-dim" x="115" y="174" text-anchor="middle" font-size="10">a row exists</text>
  <rect class="fill-accent-tint stroke-accent" x="300" y="128" width="170" height="64" rx="6" stroke-width="1.4"/>
  <text class="fill-strong" x="385" y="156" text-anchor="middle" font-size="13" font-weight="600">running</text>
  <text class="fill-dim" x="385" y="174" text-anchor="middle" font-size="10">claimed_by · lease_expires_at</text>
  <rect class="fill-bg stroke-rule" x="600" y="56" width="132" height="56" rx="6"/>
  <text class="fill-strong" x="666" y="82" text-anchor="middle" font-size="12.5" font-weight="600" style="fill:#4b6539">completed</text>
  <text class="fill-dim" x="666" y="99" text-anchor="middle" font-size="10">terminal</text>
  <rect class="fill-bg stroke-rule" x="600" y="196" width="132" height="56" rx="6"/>
  <text class="fill-accent" x="666" y="222" text-anchor="middle" font-size="12.5" font-weight="600">failed</text>
  <text class="fill-dim" x="666" y="239" text-anchor="middle" font-size="10">terminal</text>
  <rect class="fill-bg stroke-amber" x="300" y="256" width="170" height="58" rx="6"/>
  <text class="fill-amber" x="385" y="282" text-anchor="middle" font-size="12" font-weight="600">reclaim sweep</text>
  <text class="fill-dim" x="385" y="299" text-anchor="middle" font-size="10">orchestrator, every ~5 s</text>
  <line class="stroke-accent" x1="190" y1="160" x2="298" y2="160" stroke-width="1.5" marker-end="url(#l-acc)"/>
  <text class="fill-accent" x="244" y="151" text-anchor="middle" font-size="9.5">claim · SKIP LOCKED</text>
  <path class="stroke-rule" d="M345,128 C350,92 420,92 425,128" fill="none" stroke-width="1.3" marker-end="url(#l-mut)"/>
  <text class="fill-dim" x="385" y="86" text-anchor="middle" font-size="9.5">renew every 10 s · lease 600 s</text>
  <line x1="470" y1="150" x2="598" y2="92" stroke="#4b6539" stroke-width="1.5" marker-end="url(#l-ok)"/>
  <text x="548" y="104" text-anchor="middle" font-size="9.5" style="fill:#4b6539">all steps ok</text>
  <line class="stroke-accent" x1="470" y1="172" x2="598" y2="216" stroke-width="1.5" marker-end="url(#l-acc)"/>
  <text class="fill-accent" x="556" y="206" text-anchor="middle" font-size="9.5">error · retries spent</text>
  <line class="stroke-amber" x1="385" y1="192" x2="385" y2="254" stroke-width="1.5" marker-end="url(#l-amb)"/>
  <text class="fill-amber" x="395" y="228" font-size="9.5">lease lapses · or a watchdog exits</text>
  <path class="stroke-amber" d="M300,285 C180,285 115,250 115,194" fill="none" stroke-width="1.5" marker-end="url(#l-amb)"/>
  <text class="fill-amber" x="150" y="250" font-size="9.5">re-queue + notify</text>
</svg>
