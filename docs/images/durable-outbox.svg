<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="outbox-title"><style>
svg{--bg:#f6f4f3;--ink:#191416;--soft:#453e40;--faint:#6d6567;--accent:#7a2733;--tint:rgba(122,39,51,.1);--warn:#a06c14;--rule:#ded7d6;font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){svg{--bg:#161b22;--ink:#e6edf3;--soft:#b6bfc9;--faint:#8b949e;--accent:#ff8a8a;--tint:rgba(255,138,138,.12);--warn:#e3b341;--rule:#3d444d}}
.backdrop{fill:var(--bg)}.fill-strong{fill:var(--ink)}.fill-muted{fill:var(--soft)}.fill-dim{fill:var(--faint)}
.fill-accent{fill:var(--accent)}.fill-amber{fill:var(--warn)}.fill-bg{fill:var(--bg)}.fill-accent-tint{fill:var(--tint)}
.stroke-accent{stroke:var(--accent)}.stroke-amber{stroke:var(--warn)}.stroke-rule{stroke:var(--faint)}
</style><rect class="backdrop" width="760" height="300" rx="8"/>
  <title id="outbox-title">The worker writes the terminal status and the dispatch event in one transaction; the orchestrator drains the outbox and fans out</title>
  <defs>
    <marker id="o-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b2f23"/></marker>
    <marker id="o-amb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5871e"/></marker>
  </defs>
  <rect class="fill-bg stroke-rule" x="26" y="64" width="284" height="172" rx="6"/>
  <text class="fill-strong" x="168" y="88" text-anchor="middle" font-size="12.5" font-weight="600">Claim worker — finalize node</text>
  <rect class="fill-accent-tint stroke-accent" x="44" y="104" width="248" height="116" rx="5" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text class="fill-accent" x="168" y="124" text-anchor="middle" font-size="10.5" font-weight="600">ONE TRANSACTION</text>
  <rect class="fill-bg stroke-rule" x="58" y="136" width="220" height="34" rx="4"/>
  <text class="fill-strong" x="168" y="157" text-anchor="middle" font-size="10.5">UPDATE node_job → completed</text>
  <rect class="fill-bg stroke-rule" x="58" y="178" width="220" height="34" rx="4"/>
  <text class="fill-strong" x="168" y="199" text-anchor="middle" font-size="10.5">INSERT workflow_dispatch_events</text>
  <rect class="fill-bg stroke-rule" x="362" y="112" width="128" height="76" rx="6"/>
  <text class="fill-strong" x="426" y="142" text-anchor="middle" font-size="11.5" font-weight="600">dispatch events</text>
  <text class="fill-dim" x="426" y="160" text-anchor="middle" font-size="10">durable outbox</text>
  <rect class="fill-bg stroke-rule" x="556" y="46" width="186" height="78" rx="6"/>
  <text class="fill-strong" x="649" y="74" text-anchor="middle" font-size="12.5" font-weight="600">Orchestrator</text>
  <text class="fill-muted" x="649" y="92" text-anchor="middle" font-size="10">drains outbox each tick</text>
  <text class="fill-muted" x="649" y="106" text-anchor="middle" font-size="10">retry · poison after 10</text>
  <rect class="fill-bg stroke-rule" x="556" y="176" width="186" height="80" rx="6"/>
  <text class="fill-strong" x="649" y="204" text-anchor="middle" font-size="12.5" font-weight="600">Enqueue ready nodes</text>
  <text class="fill-muted" x="649" y="222" text-anchor="middle" font-size="10">deps all completed / skipped</text>
  <text class="fill-muted" x="649" y="236" text-anchor="middle" font-size="10">→ new workflow_node_jobs</text>
  <line class="stroke-accent" x1="310" y1="150" x2="360" y2="150" stroke-width="1.6" marker-end="url(#o-acc)"/>
  <text class="fill-accent" x="335" y="142" text-anchor="middle" font-size="9">atomic</text>
  <path class="stroke-amber" d="M490,140 C525,130 525,95 554,90" fill="none" stroke-width="1.5" marker-end="url(#o-amb)"/>
  <text class="fill-amber" x="520" y="118" text-anchor="middle" font-size="9.5">drain (retryable)</text>
  <line class="stroke-accent" x1="649" y1="124" x2="649" y2="174" stroke-width="1.6" marker-end="url(#o-acc)"/>
  <text class="fill-accent" x="657" y="153" font-size="9.5">on_node_completed</text>
  <path class="stroke-rule" d="M556,216 C520,216 460,210 460,190" fill="none" stroke-width="1.3" marker-end="url(#o-amb)"/>
  <text class="fill-dim" x="486" y="236" text-anchor="middle" font-size="9">re-enters as queued node-jobs</text>
</svg>
