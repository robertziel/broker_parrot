# Broker-managed LLM servers — ollama (the always-on baseline) + vLLM (per-model, heavier).
# In the v2 model, client projects do NOT run their own ollama/vLLM; these cluster-managed
# Services are the shared inference backends the broker routes workers to (via the
# AI_LEADS_OLLAMA_URL / AI_LEADS_VLLM_URL config knobs in broker-config).
#
# TODAY these are static Deployments. The broker CONTROLLER that scales/(re)models the vLLM
# Deployment from live queue demand is a follow-up — see docs/gpu_and_llm.md §4.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: broker-parrot
  labels: { app: ollama }
spec:
  replicas: 1
  selector:
    matchLabels: { app: ollama }
  template:
    metadata:
      labels: { app: ollama }
    spec:
      containers:
        - name: ollama
          # PINNED, not `:latest` — an unpinned tag is how a fleet ends up two releases behind
          # the models it is asked to serve. ollama gates model support on the runtime version
          # and stamps the floor into the model manifest itself (`ollama show` prints a
          # `requires` line); a box below that floor downloads the weights happily and then
          # cannot load them. Observed: a model whose manifest required **0.32.12** was being
          # served by boxes on 0.32.0 and 0.32.9 — all of them silently short, because nothing
          # pinned or asserted a version anywhere.
          #
          # 0.33.2 is what was actually exercised: a 27B chat model loaded 100% GPU and
          # generated under it on both CUDA (`ollama/ollama:0.33.2`) and ROCm (the matching
          # `0.33.2-rocm`) boxes. Bump this deliberately, after checking the new model
          # floors — never by re-resolving a floating tag.
          image: ollama/ollama:0.33.2
          ports:
            - containerPort: 11434
          readinessProbe:
            httpGet: { path: /api/tags, port: 11434 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              nvidia.com/gpu: "1"
      # nodeSelector/tolerations for GPU nodes are cluster-specific — set them for your fleet.
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: broker-parrot
spec:
  selector: { app: ollama }
  ports:
    - { name: http, port: 11434, targetPort: 11434 }
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: broker-parrot
  labels: { app: vllm }
spec:
  replicas: 1
  selector:
    matchLabels: { app: vllm }
  template:
    metadata:
      labels: { app: vllm }
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          # The served model is set here today; the broker controller will (re)set it from
          # demand (see design doc). OpenAI-compatible server on :8000.
          args: ["--model", "REPLACE_ME/served-model", "--port", "8000"]
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            limits:
              nvidia.com/gpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: broker-parrot
spec:
  selector: { app: vllm }
  ports:
    - { name: http, port: 8000, targetPort: 8000 }
  type: ClusterIP
