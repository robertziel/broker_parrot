[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# The CLIENT distribution keeps its established name `queue_workflows` — consumers
# install it by PATH (editable / PYTHONPATH mount / wheel built from this tree),
# not by index name, and one consumer's wheel build globs `queue_workflows-*.whl`,
# so renaming the dist would break it for zero benefit.
name = "queue_workflows"
version = "1.5.0"
description = "broker_parrot — a self-hosted job fleet on the database you already run (Postgres or SQLite): DAG workflows, SKIP LOCKED claims, lease-based crash recovery, GPU warm-model routing, LLM server management. Import package `queue_workflows`."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Robert Zieliński", email = "hello@robertz.co" }]
keywords = ["postgres", "sqlite", "job-queue", "task-queue", "workflow-engine", "dag", "skip-locked", "gpu", "job-scheduler", "llm-serving", "vllm", "ollama", "self-hosted", "mlops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: System :: Distributed Computing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "psycopg[binary,pool]>=3.1",   # the only hard runtime dep (pool + connection + LISTEN/NOTIFY)
]

[project.optional-dependencies]
metrics = ["psutil"]               # hw_metrics CPU/RAM probe (GPU probe shells out, no dep)
topology = ["PyYAML>=6"]           # per-box LLM topology YAML (config llm_topology_path); absent ⇒ env/default
test = ["pytest", "pytest-cov", "PyYAML>=6"]

[project.scripts]
queue-claim-worker   = "queue_workflows.claim_worker:main"   # generic CLIs (used standalone / other projects)
queue-scheduler      = "queue_workflows.scheduler:main"
queue-orchestrator   = "queue_workflows.orchestrator:main"
queue-worker-control = "queue_workflows.worker_control:main"  # turn a (host,queue) worker ON/OFF
queue-hw-watch       = "queue_workflows.hw_watch:main"        # standalone hardware flight recorder (2-tier persisted telemetry)
queue-box-agent      = "queue_workflows.box_agent:main"       # per-box fleet supervisor (worker_controls = the one source of truth)

[tool.hatch.build.targets.wheel]
packages = ["queue_workflows"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# One distribution lives in this repo: the client (queue_workflows, at root).
pythonpath = ["."]
